services:
  db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bakery_pos}
      POSTGRES_USER: ${POSTGRES_USER:-bakery}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bakery_local_only}
    ports:
      - "5432:5432"
    volumes:
      - bakery_pos_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  db-test:
    profiles: ["test"]
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: bakery_pos_test
      POSTGRES_USER: bakery
      POSTGRES_PASSWORD: bakery_test_only
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HTTP_ADDR: ${APP_HTTP_ADDR:-:8080}
      APP_ALLOWED_ORIGIN: ${APP_ALLOWED_ORIGIN:-http://localhost:5173}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-false}
      APP_SESSION_TTL: ${APP_SESSION_TTL:-12h}
      APP_OFFLINE_SIGNING_KEY: ${APP_OFFLINE_SIGNING_KEY:-development-only-change-this-key-32chars}
      DATABASE_URL: ${DATABASE_URL:-postgres://bakery:bakery_local_only@db:5432/bakery_pos?sslmode=disable}
    command:
      - /bin/sh
      - -c
      - goose -dir /app/migrations postgres "$${DATABASE_URL}" up && /app/api
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

  seed:
    profiles: ["tools"]
    build:
      context: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://bakery:bakery_local_only@db:5432/bakery_pos?sslmode=disable}
      DEMO_OWNER_NAME: ${DEMO_OWNER_NAME:-Dueño Demo}
      DEMO_OWNER_USERNAME: ${DEMO_OWNER_USERNAME:-owner}
      DEMO_OWNER_PASSWORD: ${DEMO_OWNER_PASSWORD:-change-me-local}
      DEMO_EMPLOYEE_NAME: ${DEMO_EMPLOYEE_NAME:-Empleado Demo}
      DEMO_EMPLOYEE_USERNAME: ${DEMO_EMPLOYEE_USERNAME:-employee}
      DEMO_EMPLOYEE_PASSWORD: ${DEMO_EMPLOYEE_PASSWORD:-employee-local}
    command: ["/app/seed"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  bakery_pos_data:
