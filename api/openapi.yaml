openapi: 3.1.0
info:
  title: Bakery POS API
  version: 0.4.0
  description: Contrato de fundaciones, catálogo, inventario, ventas y caja online del MVP.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Sesión iniciada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /auth/logout:
    post:
      operationId: logout
      security:
        - sessionCookie: []
      responses:
        "204":
          description: Sesión cerrada.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me:
    get:
      operationId: getCurrentUser
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Usuario autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /categories:
    get:
      operationId: listCategories
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Categorías ordenadas por estado y nombre.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Category" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createCategory
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        "201":
          description: Categoría creada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /products:
    get:
      operationId: listProducts
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: active, in: query, schema: { type: boolean } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Página de productos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProductList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      operationId: createProduct
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductInput" }
      responses:
        "201":
          description: Producto creado con saldo inicial cero y precio versionado cuando corresponde.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /products/{id}:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: getProduct
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Producto encontrado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      operationId: updateProduct
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductPatch"
      responses:
        "200":
          description: Producto actualizado sin reescribir precios anteriores.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /products/{id}/prices:
    parameters:
      - $ref: "#/components/parameters/ProductID"
    get:
      operationId: getProductPriceHistory
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Historial de precios, más reciente primero.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Price" }
        "404": { $ref: "#/components/responses/NotFound" }
  /products/import/preview:
    post:
      operationId: previewProductImport
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportPreviewRequest" }
      responses:
        "200":
          description: Filas normalizadas, errores y hash vinculante.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportPreview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /products/import/commit:
    post:
      operationId: commitProductImport
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/ImportPreviewRequest"
                - type: object
                  required: [preview_hash]
                  properties:
                    preview_hash: { type: string, minLength: 64, maxLength: 64 }
      responses:
        "201":
          description: Importación atómica confirmada.
          content:
            application/json:
              schema:
                type: object
                required: [imported_count, catalog_version]
                properties:
                  imported_count: { type: integer }
                  catalog_version: { type: integer, format: int64 }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /prices/bulk-preview:
    post:
      operationId: previewBulkPrices
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkPriceRequest" }
      responses:
        "200":
          description: Precios anteriores y nuevos sin mutar el catálogo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkPricePreview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /prices/bulk-commit:
    post:
      operationId: commitBulkPrices
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/BulkPriceRequest"
                - type: object
                  required: [preview_hash]
                  properties:
                    preview_hash: { type: string, minLength: 64, maxLength: 64 }
      responses:
        "200":
          description: Aumento aplicado atómicamente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkPricePreview" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /pos/catalog-snapshot:
    get:
      operationId: getCatalogSnapshot
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Productos activos y vendibles para el POS, con versión.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CatalogSnapshot" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /pos/device/acquire:
    post:
      summary: Adquirir el puesto de venta
      operationId: acquirePOSDevice
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AcquireDeviceRequest" }
      responses:
        "200":
          description: Sesión POS activa, nueva o idempotentemente recuperada para el mismo dispositivo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeviceSession" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /pos/device/release:
    post:
      summary: Liberar el puesto de venta
      operationId: releasePOSDevice
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReleaseDeviceRequest" }
      responses:
        "204": { description: Sesión POS liberada. }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /cash/shifts:
    post:
      summary: Abrir un turno de caja
      operationId: openCashShift
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OpenCashShiftRequest" }
      responses:
        "201":
          description: Turno abierto con efectivo inicial confirmado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashShift" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /cash/shifts/current:
    get:
      summary: Consultar el turno de caja abierto
      operationId: getCurrentCashShift
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Turno vigente o null si la caja está cerrada.
          content:
            application/json:
              schema:
                type: object
                required: [shift]
                properties:
                  shift: { oneOf: [{ $ref: "#/components/schemas/CashShift" }, { type: "null" }] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /cash/shifts/{id}/movements:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Registrar un movimiento manual de caja
      operationId: recordCashMovement
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordCashMovementRequest" }
      responses:
        "201":
          description: Movimiento inmutable registrado y turno actualizado.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashShift" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /cash/shifts/{id}/close:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      summary: Cerrar y arquear un turno online
      operationId: closeCashShift
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CloseCashShiftRequest" }
      responses:
        "200":
          description: Cierre definitivo con esperado, contado y diferencia.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CashShift" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /sales:
    get:
      summary: Listar ventas recientes
      operationId: listSales
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Ventas con ítems, pagos e incidencias.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SaleList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
    post:
      summary: Confirmar una venta online
      operationId: createSale
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSaleRequest" }
      responses:
        "201":
          description: Venta, pagos, caja, inventario, incidencias y auditoría confirmados atómicamente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "200":
          description: Reintento idempotente; devuelve la venta ya confirmada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /sales/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      summary: Obtener una venta y su comprobante interno
      operationId: getSale
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Venta encontrada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "404": { $ref: "#/components/responses/NotFound" }
  /pos/offline-authorizations:
    post:
      summary: Preparar el dispositivo activo para ventas offline durante 24 horas
      operationId: issueOfflineAuthorization
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OfflineAuthorizationRequest" }
      responses:
        "201":
          description: Autorización firmada y acotada al usuario, dispositivo, turno y catálogo.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfflineAuthorization" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /sync/operations:
    post:
      summary: Sincronizar el diario POS en orden
      operationId: syncOperations
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SyncBatchRequest" }
      responses:
        "200":
          description: ACK durable por operación; el lote se detiene ante evidencia de recuperación.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncBatchResult" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /sync/status:
    get:
      summary: Consultar continuidad reconocida del diario
      operationId: getSyncStatus
      security: [{ sessionCookie: [] }]
      parameters:
        - { name: device_session_id, in: query, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: Último ACK conocido por el servidor.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncStatus" }
  /pos/recovery/force:
    post:
      summary: Cercar el dispositivo anterior y abrir recuperación conciliable
      operationId: forcePOSRecovery
      security: [{ sessionCookie: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ForceRecoveryRequest" }
      responses:
        "201":
          description: Caso abierto y dispositivo de reemplazo adquirido.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCase" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /pos/recovery/current:
    get:
      summary: Obtener la conciliación activa
      operationId: getActivePOSRecovery
      security: [{ sessionCookie: [] }]
      responses:
        "200":
          description: Caso activo o null.
          content:
            application/json:
              schema:
                type: object
                required: [recovery]
                properties:
                  recovery:
                    oneOf:
                      - { $ref: "#/components/schemas/RecoveryDetails" }
                      - { type: "null" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /pos/recovery/{id}/differences:
    post:
      summary: Documentar una diferencia de conciliación
      operationId: addRecoveryDifference
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/RecoveryCaseID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryDifferenceRequest" }
      responses:
        "201":
          description: Conciliación actualizada.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryDetails" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /pos/recovery/{id}/controls:
    put:
      summary: Guardar controles de conciliación
      operationId: updateRecoveryControls
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/RecoveryCaseID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryControlsRequest" }
      responses:
        "200":
          description: Controles guardados.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryDetails" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
  /pos/recovery/{id}/reconstructions:
    post:
      summary: Reconstruir una venta conocida dentro de una conciliación
      operationId: reconstructRecoverySale
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/RecoveryCaseID" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecoveryReconstructionRequest" }
      responses:
        "201":
          description: Venta reconstruida idempotentemente.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Sale" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /pos/recovery/{id}/close:
    post:
      summary: Resolver la conciliación después de completar todos los controles
      operationId: closePOSRecovery
      security: [{ sessionCookie: [] }]
      parameters: [{ $ref: "#/components/parameters/RecoveryCaseID" }]
      responses:
        "200":
          description: Conciliación resuelta.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryDetails" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /inventory/balances:
    get:
      summary: Listar saldos de inventario
      operationId: listInventoryBalances
      security: [{ sessionCookie: [] }]
      parameters:
        - name: q
          in: query
          description: Búsqueda parcial por nombre de producto.
          schema: { type: string }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Saldos proyectados desde el libro de movimientos.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryBalanceList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /inventory/movements:
    get:
      summary: Listar movimientos de inventario
      operationId: listInventoryMovements
      security: [{ sessionCookie: [] }]
      parameters:
        - name: product_id
          in: query
          schema: { type: string, format: uuid }
        - name: movement_type
          in: query
          schema: { $ref: "#/components/schemas/InventoryMovementType" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
      responses:
        "200":
          description: Libro inmutable de movimientos, más reciente primero.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InventoryMovementList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: bakery_pos_session
  parameters:
    ProductID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    RecoveryCaseID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 80
        password:
          type: string
          minLength: 8
          maxLength: 256
    User:
      type: object
      additionalProperties: false
      required: [id, name, username, role, permissions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        username:
          type: string
        role:
          type: string
          enum: [seller, owner]
        permissions:
          type: array
          uniqueItems: true
          items:
            type: string
    Category:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    ProductInput:
      type: object
      additionalProperties: false
      required: [category_id, name, product_type, sale_mode, base_unit, sellable, track_lots, barcode]
      properties:
        category_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        product_type: { type: string, enum: [ingredient, produced, resale] }
        sale_mode: { type: string, enum: [unit, weight] }
        base_unit: { type: string, enum: [unit, g, ml] }
        sellable: { type: boolean }
        track_lots: { type: boolean }
        barcode: { type: string, maxLength: 64 }
        price_cents: { type: integer, format: int64, minimum: 1 }
    Product:
      allOf:
        - $ref: "#/components/schemas/ProductInput"
        - type: object
          required: [id, category_name, active, current_price_cents, price_unit, created_at, updated_at]
          properties:
            id: { type: string, format: uuid }
            category_name: { type: string }
            active: { type: boolean }
            current_price_cents:
              type: [integer, "null"]
              format: int64
            price_unit:
              type: [string, "null"]
              enum: [unit, kg, null]
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    ProductPatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        category_id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 120 }
        product_type: { type: string, enum: [ingredient, produced, resale] }
        sale_mode: { type: string, enum: [unit, weight] }
        base_unit: { type: string, enum: [unit, g, ml] }
        sellable: { type: boolean }
        track_lots: { type: boolean }
        active: { type: boolean }
        barcode: { type: string, maxLength: 64 }
        price_cents: { type: integer, format: int64, minimum: 1 }
    ProductList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        total: { type: integer }
        limit: { type: integer }
        offset: { type: integer }
    Price:
      type: object
      required: [id, product_id, amount_cents, price_unit, effective_from, actor_id]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        amount_cents: { type: integer, format: int64 }
        price_unit: { type: string, enum: [unit, kg] }
        effective_from: { type: string, format: date-time }
        effective_to: { type: [string, "null"], format: date-time }
        actor_id: { type: string, format: uuid }
    BulkPriceRequest:
      type: object
      additionalProperties: false
      required: [percentage, product_ids]
      properties:
        percentage:
          type: string
          pattern: "^[0-9]+(?:\\.[0-9]{1,2})?$"
          description: Porcentaje decimal positivo, máximo 1000.
        product_ids:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
          description: Vacío aplica a todos los productos activos con precio.
    BulkPriceItem:
      type: object
      required: [product_id, product_name, old_price_cents, new_price_cents, price_unit]
      properties:
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        old_price_cents: { type: integer, format: int64 }
        new_price_cents: { type: integer, format: int64 }
        price_unit: { type: string, enum: [unit, kg] }
    BulkPricePreview:
      type: object
      required: [percentage, preview_hash, items]
      properties:
        percentage: { type: string }
        preview_hash: { type: string }
        items:
          type: array
          items: { $ref: "#/components/schemas/BulkPriceItem" }
    ImportPreviewRequest:
      type: object
      additionalProperties: false
      required: [csv]
      properties:
        csv: { type: string, maxLength: 1900000 }
    ImportRow:
      type: object
      required: [row_number, name, category, errors]
      properties:
        row_number: { type: integer }
        name: { type: string }
        category: { type: string }
        barcode: { type: string }
        errors:
          type: array
          items: { type: string }
    ImportPreview:
      type: object
      required: [preview_hash, valid_count, error_count, rows]
      properties:
        preview_hash: { type: string }
        valid_count: { type: integer }
        error_count: { type: integer }
        rows:
          type: array
          items: { $ref: "#/components/schemas/ImportRow" }
    CatalogSnapshot:
      type: object
      required: [version, generated_at, products]
      properties:
        version: { type: integer, format: int64 }
        generated_at: { type: string, format: date-time }
        products:
          type: array
          items: { $ref: "#/components/schemas/Product" }
    AcquireDeviceRequest:
      type: object
      additionalProperties: false
      required: [device_id, device_name]
      properties:
        device_id: { type: string, format: uuid }
        device_name: { type: string, minLength: 1, maxLength: 80 }
    ReleaseDeviceRequest:
      type: object
      additionalProperties: false
      required: [session_id, fencing_version, pending_operations]
      properties:
        session_id: { type: string, format: uuid }
        fencing_version: { type: integer, format: int64, minimum: 1 }
        pending_operations: { type: integer, minimum: 0, maximum: 0 }
    DeviceSession:
      type: object
      additionalProperties: false
      required: [id, device_id, device_name, user_id, status, fencing_version, acquired_at]
      properties:
        id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        device_name: { type: string }
        user_id: { type: string, format: uuid }
        status: { type: string, enum: [active, released, recovery_required] }
        fencing_version: { type: integer, format: int64, minimum: 1 }
        acquired_at: { type: string, format: date-time }
        released_at: { type: string, format: date-time }
    OpenCashShiftRequest:
      type: object
      additionalProperties: false
      required: [device_session_id, fencing_version, opening_cash_cents, opening_note]
      properties:
        device_session_id: { type: string, format: uuid }
        fencing_version: { type: integer, format: int64, minimum: 1 }
        opening_cash_cents: { type: integer, format: int64, minimum: 0 }
        opening_note: { type: string, maxLength: 300 }
    RecordCashMovementRequest:
      type: object
      additionalProperties: false
      required: [id, expected_version, movement_type, amount_cents, reason, recipient]
      properties:
        id: { type: string, format: uuid }
        expected_version: { type: integer, format: int64, minimum: 1 }
        movement_type: { type: string, enum: [income, expense, withdrawal] }
        amount_cents: { type: integer, format: int64, minimum: 1 }
        reason: { type: string, minLength: 3, maxLength: 300 }
        recipient: { type: string, maxLength: 120 }
    CloseCashShiftRequest:
      type: object
      additionalProperties: false
      required: [expected_version, counted_cash_cents, closing_note]
      properties:
        expected_version: { type: integer, format: int64, minimum: 1 }
        counted_cash_cents: { type: integer, format: int64, minimum: 0 }
        closing_note: { type: string, maxLength: 300 }
    CashShift:
      type: object
      additionalProperties: false
      required: [id, status, version, device_session_id, opened_by, opening_cash_cents, opened_at, expected_cash_cents]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [open, closed, provisional_closed, reconciliation_required] }
        version: { type: integer, format: int64, minimum: 1 }
        device_session_id: { type: string, format: uuid }
        opened_by: { type: string, format: uuid }
        opening_cash_cents: { type: integer, format: int64, minimum: 0 }
        opening_note: { type: string }
        opened_at: { type: string, format: date-time }
        closed_by: { type: string, format: uuid }
        counted_cash_cents: { type: integer, format: int64, minimum: 0 }
        expected_cash_cents: { type: integer, format: int64 }
        difference_cents: { type: integer, format: int64 }
        closing_note: { type: string }
        closed_at: { type: string, format: date-time }
    SaleItemRequest:
      type: object
      additionalProperties: false
      required: [product_id, quantity]
      properties:
        product_id: { type: string, format: uuid }
        quantity: { $ref: "#/components/schemas/InventoryQuantity" }
    SalePaymentRequest:
      type: object
      additionalProperties: false
      required: [method, amount_cents, status, external_reference, verification_method]
      properties:
        method: { type: string, enum: [cash, transfer, qr, card, other] }
        amount_cents: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [reported, confirmed] }
        received_cents: { type: integer, format: int64, minimum: 1 }
        external_reference: { type: string, maxLength: 160 }
        verification_method: { type: string, maxLength: 120 }
    CreateSaleRequest:
      type: object
      additionalProperties: false
      required: [operation_id, device_session_id, fencing_version, cash_shift_id, shift_version, catalog_version, items, payments]
      properties:
        operation_id: { type: string, format: uuid }
        device_session_id: { type: string, format: uuid }
        fencing_version: { type: integer, format: int64, minimum: 1 }
        cash_shift_id: { type: string, format: uuid }
        shift_version: { type: integer, format: int64, minimum: 1 }
        catalog_version: { type: integer, format: int64, minimum: 1 }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/SaleItemRequest" }
        payments:
          type: array
          minItems: 1
          maxItems: 10
          items: { $ref: "#/components/schemas/SalePaymentRequest" }
    OfflineAuthorizationRequest:
      type: object
      additionalProperties: false
      required: [device_session_id, fencing_version, cash_shift_id, shift_version, catalog_version]
      properties:
        device_session_id: { type: string, format: uuid }
        fencing_version: { type: integer, format: int64, minimum: 1 }
        cash_shift_id: { type: string, format: uuid }
        shift_version: { type: integer, format: int64, minimum: 1 }
        catalog_version: { type: integer, format: int64, minimum: 1 }
    OfflineAuthorization:
      type: object
      required: [token, user_id, device_id, device_session_id, fencing_version, cash_shift_id, shift_version, catalog_version, issued_at, expires_at]
      properties:
        token: { type: string }
        user_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        device_session_id: { type: string, format: uuid }
        fencing_version: { type: integer, format: int64 }
        cash_shift_id: { type: string, format: uuid }
        shift_version: { type: integer, format: int64 }
        catalog_version: { type: integer, format: int64 }
        issued_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    OfflineOperation:
      type: object
      additionalProperties: false
      required: [operation_id, operation_type, device_id, device_session_id, fencing_version, sequence, created_at_local, timezone, previous_hash, payload_hash, authorization, payload]
      properties:
        operation_id: { type: string, format: uuid }
        operation_type: { type: string, enum: [sale, shift_close, shift_open] }
        device_id: { type: string, format: uuid }
        device_session_id: { type: string, format: uuid }
        fencing_version: { type: integer, format: int64, minimum: 1 }
        sequence: { type: integer, format: int64, minimum: 1 }
        created_at_local: { type: string, format: date-time }
        timezone: { type: string, minLength: 1, maxLength: 80 }
        previous_hash: { type: string, pattern: "^(?:|[0-9a-f]{64})$" }
        payload_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        authorization: { type: string }
        payload:
          oneOf:
            - { $ref: "#/components/schemas/CreateSaleRequest" }
            - { $ref: "#/components/schemas/OfflineCloseShiftRequest" }
            - { $ref: "#/components/schemas/OfflineOpenShiftRequest" }
    OfflineCloseShiftRequest:
      type: object
      additionalProperties: false
      required: [cash_shift_id, expected_version, counted_cash_cents, closing_note]
      properties:
        cash_shift_id: { type: string, format: uuid }
        expected_version: { type: integer, format: int64, minimum: 1 }
        counted_cash_cents: { type: integer, format: int64, minimum: 0 }
        closing_note: { type: string, maxLength: 500 }
    OfflineOpenShiftRequest:
      type: object
      additionalProperties: false
      required: [id, previous_cash_shift_id, device_session_id, fencing_version, opening_cash_cents, opening_note]
      properties:
        id: { type: string, format: uuid }
        previous_cash_shift_id: { type: string, format: uuid }
        device_session_id: { type: string, format: uuid }
        fencing_version: { type: integer, format: int64, minimum: 1 }
        opening_cash_cents: { type: integer, format: int64, minimum: 0 }
        opening_note: { type: string, maxLength: 500 }
    SyncBatchRequest:
      type: object
      additionalProperties: false
      required: [operations]
      properties:
        operations:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: "#/components/schemas/OfflineOperation" }
    SyncACK:
      type: object
      required: [operation_id, sequence, payload_hash, status, replayed]
      properties:
        operation_id: { type: string, format: uuid }
        sequence: { type: integer, format: int64 }
        payload_hash: { type: string }
        status: { type: string, enum: [acknowledged, recovery_evidence] }
        sale_id: { type: string, format: uuid }
        shift_id: { type: string, format: uuid }
        replayed: { type: boolean }
    SyncBatchResult:
      type: object
      required: [acks]
      properties:
        acks:
          type: array
          items: { $ref: "#/components/schemas/SyncACK" }
    SyncStatus:
      type: object
      required: [device_session_id, last_sequence, last_hash]
      properties:
        device_session_id: { type: string, format: uuid }
        last_sequence: { type: integer, format: int64, minimum: 0 }
        last_hash: { type: string }
        recovery_case_id: { type: string, format: uuid }
    ForceRecoveryRequest:
      type: object
      additionalProperties: false
      required: [previous_session_id, device_id, device_name, reason, cash_count_cents]
      properties:
        previous_session_id: { type: string, format: uuid }
        device_id: { type: string, format: uuid }
        device_name: { type: string, minLength: 1, maxLength: 80 }
        reason: { type: string, minLength: 10, maxLength: 500 }
        cash_count_cents: { type: integer, format: int64, minimum: 0 }
    RecoveryCase:
      type: object
      required: [id, previous_session_id, replacement_session_id, status, reason, last_ack_sequence, last_ack_hash, cash_count_cents, opened_at, previous_fencing_version, affected_shift_version, replacement_session]
      properties:
        id: { type: string, format: uuid }
        previous_session_id: { type: string, format: uuid }
        replacement_session_id: { type: string, format: uuid }
        affected_shift_id: { type: string, format: uuid }
        status: { type: string, enum: [open, resolved] }
        reason: { type: string }
        last_ack_sequence: { type: integer, format: int64 }
        last_ack_hash: { type: string }
        cash_count_cents: { type: integer, format: int64 }
        opened_at: { type: string, format: date-time }
        previous_fencing_version: { type: integer, format: int64, minimum: 1 }
        affected_shift_version: { type: integer, format: int64, minimum: 0 }
        replacement_session: { $ref: "#/components/schemas/DeviceSession" }
    RecoveryDifferenceRequest:
      type: object
      additionalProperties: false
      required: [id, kind, description]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [unknown_sale_total, cash, digital_payment, inventory, sequence_gap] }
        amount_cents: { type: integer, format: int64 }
        description: { type: string, minLength: 3, maxLength: 500 }
    RecoveryDifference:
      allOf:
        - { $ref: "#/components/schemas/RecoveryDifferenceRequest" }
        - type: object
          required: [created_at]
          properties:
            created_at: { type: string, format: date-time }
            resolved_at: { type: string, format: date-time }
    RecoveryControlsRequest:
      type: object
      additionalProperties: false
      required: [journal_status, gaps_documented, digital_payments_reviewed, inventory_counted, owner_approved]
      properties:
        journal_status: { type: string, enum: [imported, unrecoverable] }
        gaps_documented: { type: boolean }
        digital_payments_reviewed: { type: boolean }
        inventory_counted: { type: boolean }
        owner_approved: { type: boolean }
    RecoveryDetails:
      allOf:
        - { $ref: "#/components/schemas/RecoveryCase" }
        - type: object
          required: [journal_status, gaps_documented, digital_payments_reviewed, inventory_counted, owner_approved, differences]
          properties:
            journal_status: { type: string, enum: [pending, imported, unrecoverable] }
            gaps_documented: { type: boolean }
            digital_payments_reviewed: { type: boolean }
            inventory_counted: { type: boolean }
            owner_approved: { type: boolean }
            differences:
              type: array
              items: { $ref: "#/components/schemas/RecoveryDifference" }
    RecoveryReconstructionRequest:
      type: object
      additionalProperties: false
      required: [reconciliation_operation_id, certainty, evidence, sale]
      properties:
        reconciliation_operation_id: { type: string, format: uuid }
        source_operation_id: { type: string, format: uuid }
        certainty: { type: string, enum: [exact, probable] }
        evidence: { type: string, minLength: 3, maxLength: 500 }
        sale: { $ref: "#/components/schemas/CreateSaleRequest" }
    SaleItem:
      type: object
      required: [id, line_number, product_id, product_name, sale_mode, base_unit, quantity, unit_price_cents, price_unit, subtotal_cents, catalog_version]
      properties:
        id: { type: string, format: uuid }
        line_number: { type: integer, minimum: 1 }
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        sale_mode: { type: string, enum: [unit, weight] }
        base_unit: { type: string, enum: [unit, g] }
        quantity: { $ref: "#/components/schemas/InventoryQuantity" }
        unit_price_cents: { type: integer, format: int64, minimum: 1 }
        price_unit: { type: string, enum: [unit, kg] }
        subtotal_cents: { type: integer, format: int64, minimum: 1 }
        catalog_version: { type: integer, format: int64, minimum: 1 }
    SalePayment:
      type: object
      required: [id, method, amount_cents, status]
      properties:
        id: { type: string, format: uuid }
        method: { type: string, enum: [cash, transfer, qr, card, other] }
        amount_cents: { type: integer, format: int64, minimum: 1 }
        status: { type: string, enum: [pending, reported, confirmed, rejected] }
        received_cents: { type: integer, format: int64 }
        change_cents: { type: integer, format: int64 }
        external_reference: { type: string }
        confirmed_by: { type: string, format: uuid }
        confirmed_at: { type: string, format: date-time }
        verification_method: { type: string }
    InventoryIncident:
      type: object
      required: [id, product_id, balance_quantity, status]
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        balance_quantity: { $ref: "#/components/schemas/InventoryQuantity" }
        status: { type: string, enum: [open, resolved] }
    Sale:
      type: object
      required: [id, cash_shift_id, device_session_id, fencing_version, actor_id, status, payment_state, catalog_version, subtotal_cents, total_cents, completed_at, cash_shift_version, items, payments, inventory_incidents, replayed]
      properties:
        id: { type: string, format: uuid }
        cash_shift_id: { type: string, format: uuid }
        device_session_id: { type: string, format: uuid }
        fencing_version: { type: integer, format: int64 }
        actor_id: { type: string, format: uuid }
        status: { type: string, enum: [completed, partially_returned, returned, voided] }
        payment_state: { type: string, enum: [unverified, settled, issue] }
        catalog_version: { type: integer, format: int64 }
        subtotal_cents: { type: integer, format: int64 }
        total_cents: { type: integer, format: int64 }
        completed_at: { type: string, format: date-time }
        cash_shift_version: { type: integer, format: int64 }
        items:
          type: array
          items: { $ref: "#/components/schemas/SaleItem" }
        payments:
          type: array
          items: { $ref: "#/components/schemas/SalePayment" }
        inventory_incidents:
          type: array
          items: { $ref: "#/components/schemas/InventoryIncident" }
        replayed: { type: boolean }
    SaleList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Sale" }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 200 }
        offset: { type: integer, minimum: 0 }
    InventoryQuantity:
      type: string
      pattern: "^-?(?:0|[0-9]{1,15})(?:\\.[0-9]{1,3})?$"
      description: Cantidad decimal exacta en unidad base, con hasta tres decimales.
      examples: ["3", "350.125", "-0.5"]
    InventoryMovementType:
      type: string
      enum: [initial, purchase, production, sale, return, waste, adjustment]
    InventoryBalance:
      type: object
      additionalProperties: false
      required: [product_id, product_name, base_unit, quantity, updated_at]
      properties:
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        base_unit: { type: string, enum: [unit, g, ml] }
        quantity: { $ref: "#/components/schemas/InventoryQuantity" }
        updated_at: { type: string, format: date-time }
    InventoryBalanceList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InventoryBalance" }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 200 }
        offset: { type: integer, minimum: 0 }
    InventoryMovement:
      type: object
      additionalProperties: false
      required:
        - id
        - product_id
        - product_name
        - base_unit
        - quantity_delta
        - movement_type
        - reference_type
        - reference_id
        - actor_id
        - request_id
        - occurred_at
        - created_at
      properties:
        id: { type: string, format: uuid }
        product_id: { type: string, format: uuid }
        product_name: { type: string }
        base_unit: { type: string, enum: [unit, g, ml] }
        quantity_delta: { $ref: "#/components/schemas/InventoryQuantity" }
        movement_type: { $ref: "#/components/schemas/InventoryMovementType" }
        reference_type: { type: string }
        reference_id: { type: [string, "null"], format: uuid }
        actor_id: { type: string, format: uuid }
        request_id: { type: string }
        reason: { type: string }
        occurred_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
    InventoryMovementList:
      type: object
      additionalProperties: false
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/InventoryMovement" }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 200 }
        offset: { type: integer, minimum: 0 }
    Error:
      type: object
      additionalProperties: false
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true
        request_id:
          type: string
  responses:
    BadRequest:
      description: Solicitud inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Credenciales o sesión inválidas.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: La sesión no tiene la capacidad requerida.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso inexistente.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Valor duplicado o previsualización desactualizada.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Datos o filtros de la operación inválidos.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Demasiados intentos.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
